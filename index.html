<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>F96 — 工厂研究档案 | Factory Study Archive</title>
<meta name="description" content="F96 — 工厂研究档案：形式灵感、艺术档案、文学意象、社会素材。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230E0D0B'/%3E%3Ctext x='16' y='23' font-family='Arial Black' font-size='18' fill='%23F2EFE9' text-anchor='middle'%3EF%3C/text%3E%3Ccircle cx='25' cy='8' r='4' fill='%23E8490F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Space+Grotesk:wght@300..700&family=Noto+Serif+SC:wght@400;600&family=Noto+Sans+SC:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- ===== Preloader ===== -->
<div class="boot-loader" aria-hidden="true">
  <div class="boot-loader__stack" id="bootStack"></div>
  <div class="boot-loader__counter" id="bootCounter">[0]</div>
  <div class="boot-loader__patch"></div>
</div>

<!-- ===== Custom cursor ===== -->
<div class="cursor" id="cursor" aria-hidden="true">
  <div class="cursor__dot"></div>
  <div class="cursor__ring"><span class="cursor__label" id="cursorLabel"></span></div>
</div>

<!-- ===== Transition layer ===== -->
<div class="transition-layer" id="transitionLayer" aria-hidden="true"></div>

<!-- ===== 详情页：左图右文 ===== -->
<div class="detail" id="detail" aria-hidden="true">
  <button class="detail__close" id="detailClose" type="button">关闭 ×</button>
  <div class="detail__inner">
    <figure class="detail__figure"><img id="detailImg" alt=""></figure>
    <div class="detail__body">
      <h2 class="detail__title" id="detailTitle"></h2>
      <p class="detail__desc" id="detailDesc"></p>
      <div class="detail__meta" id="detailMeta"></div>
    </div>
  </div>
</div>

<!-- ===== Nav ===== -->
<nav class="nav">
  <ul class="nav__links">
    <li><a href="#works" class="nav__link" data-nav data-roll><span class="nav__link-dot"></span><span class="nav__link-text">全部作品</span></a></li>
    <li><a href="#archive" class="nav__link" data-nav data-roll><span class="nav__link-dot"></span><span class="nav__link-text">档案</span></a></li>
    <li class="nav__lang"><span>中</span><i>/</i><span class="is-off">EN</span></li>
  </ul>
  <button class="nav__burger" id="burger" aria-label="菜单"><span></span><span></span></button>
</nav>

<!-- ===== Menu overlay ===== -->
<div class="menu" id="menu" aria-hidden="true">
  <div class="menu__inner">
    <p class="menu__eyebrow">M E N U</p>
    <a href="#works" class="menu__link" data-nav data-roll-menu>全部作品</a>
    <a href="#archive" class="menu__link" data-nav data-roll-menu>档案</a>
    <p class="menu__foot">工厂研究档案 — FACTORY STUDY ARCHIVE © 2026</p>
  </div>
</div>

<main id="top">

  <!-- ===== Hero：多个上下平行的 3D 圆环 ===== -->
  <section class="hero" id="hero">
    <div class="hero__stage" id="heroStage" data-cursor="drag"></div>
    <div class="hero__type">
      <h1 class="hero__title" aria-label="FACTORY 工厂">
        <span class="hero__title-line" data-hero-line>FACTORY</span>
        <span class="hero__title-cn" data-hero-line>工厂</span>
      </h1>
      <p class="hero__sub">品牌与数字设计工作室<span> / BRAND &amp; DIGITAL DESIGN STUDIO</span></p>
    </div>
    <div class="project-label" id="projectLabel" aria-hidden="true">
      <div class="project-label__pill"><span class="project-label__cue">SCROLL</span></div>
      <div class="project-label__text">
        <span class="project-label__title" id="labelTitle"></span>
        <span class="project-label__index" id="labelIndex"></span>
      </div>
    </div>
  </section>

  <!-- ===== Archive：图文叠层档案（第二部分） ===== -->
  <section class="archive" id="archive">
    <header class="section-head">
      <p class="section-head__eyebrow">A R C H I V E</p>
      <h2 class="section-head__title">研究档案 <sup id="archiveCount"></sup></h2>
    </header>
    <div id="archiveRoot"></div>
  </section>

  <!-- ===== Works index（第三部分） ===== -->
  <section class="works" id="works">
    <header class="section-head">
      <p class="section-head__eyebrow">S E L E C T E D</p>
      <h2 class="section-head__title">全部作品 <sup id="worksCount"></sup></h2>
      <div class="works__filters" id="worksFilters"></div>
    </header>
    <div class="works__list" id="worksList"></div>
    <div class="works__preview" id="worksPreview" aria-hidden="true"><img id="worksPreviewImg" alt=""></div>
  </section>

</main>

<!-- ===== 极简页脚 ===== -->
<footer class="footer">
  <div class="footer__bar">
    <span>工厂研究档案 — FACTORY STUDY ARCHIVE</span>
    <span id="footerCounter">0 / 0 selected entries</span>
    <span>© 2026</span>
  </div>
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.147.0/three.min.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
